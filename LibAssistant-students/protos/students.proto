syntax = "proto3";

package students;

service StudentsService {
  rpc CreateStudent (CreateStudentRequest) returns (CreateStudentResponse) {}
  rpc GetStudentByID (GetStudentByIDRequest) returns (GetStudentByIDResponse) {}
  rpc GetStudentByFullName (GetStudentByFullNameRequest) returns (GetStudentByFullNameResponse) {}
  rpc GetClass (GetClassRequest) returns (GetClassResponse) {}
  rpc GetParallel (GetParallelRequest) returns (GetParallelResponse) {}
  rpc GetStudentStats (GetStudentStatsRequest) returns (GetStudentStatsResponse) {}
  rpc UpdateFullNameOfStudent (UpdateFullNameOfStudentRequest) returns (UpdateFullNameOfStudentResponse) {}
  rpc UpdateGradeOfStudent (UpdateGradeOfStudentRequest) returns (UpdateGradeOfStudentResponse) {}
  rpc UpdateLetterOfStudent (UpdateLetterOfStudentRequest) returns (UpdateLetterOfStudentResponse) {}
  rpc DeleteStudentByID (DeleteStudentByIDRequest) returns (DeleteStudentByIDResponse) {}
}

//-----Create Student-----//
message CreateStudentRequest {
  string student_id = 1;
  string full_name = 2;
  int32 grade = 3;
  string letter = 4;
}

message CreateStudentResponse {
  string student_id = 1;
}
//-----Create Student-----//


//-----Get Student By ID-----//
message GetStudentByIDRequest {
  string student_id = 1;
}

message GetStudentByIDResponse {
  Student student = 1;
}
//-----Get Student By ID-----//



//-----Get Student By Full Name-----//
message GetStudentByFullNameRequest {
  string full_name = 1;
  int32 grade = 2;
  string letter = 3;
}

message GetStudentByFullNameResponse {
  Student student = 1;
}
//-----Get Student By Full Name-----//



//-----Get Class-----//
message GetClassRequest {
  int32 grade = 1;
  string letter = 2;
}

message GetClassResponse {
  repeated Student students = 1;
}
//-----Get Class-----//



//-----Get Parallel-----//
message GetParallelRequest {
  int32 grade = 1;
}

message GetParallelResponse {
  repeated Student students = 1;
}
//-----Get Parallel-----//



//-----Get Student Stats-----//
message GetStudentStatsRequest {
  string student_id = 1;
}

message GetStudentStatsResponse {
  Student student = 1;
  int64 books_taken = 2;
}
//-----Get Student Stats-----//



//-----Update Full Name Of Student-----//
message UpdateFullNameOfStudentRequest {
  string student_id = 1;
  string full_name = 2;
}

message UpdateFullNameOfStudentResponse {
  Student student = 1;
}
//-----Update Full Name Of Student-----//



//-----Update Grade Of Student-----//
message UpdateGradeOfStudentRequest {
  string student_id = 1;
  int32 grade = 2;
}

message UpdateGradeOfStudentResponse {
  Student student = 1;
}
//-----Update Grade Of Student-----//



//-----Update Letter Of Student-----//
message UpdateLetterOfStudentRequest {
  string student_id = 1;
  string letter = 2;
}

message UpdateLetterOfStudentResponse {
  Student student = 1;
}
//-----Update Letter Of Student-----//



//-----Delete Student By ID-----//
message DeleteStudentByIDRequest {
  string student_id = 1;
}

message DeleteStudentByIDResponse {
  bool success = 1;
}
//-----Delete Student By ID-----//



//-----Student-----//
message Student {
  string id = 1;
  string full_name = 2;
  int32 grade = 3;
  string letter = 4;
}
//-----Student-----//